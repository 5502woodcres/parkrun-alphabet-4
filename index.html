<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkrun Alphabet Challenge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        :root {
            --green: #2e7d32;
            --green-light: #e8f5e9;
            --blue: #1565c0;
            --blue-light: #e3f2fd;
            --orange: #e65100;
            --orange-light: #fff3e0;
            --grey: #757575;
            --border: #e0e0e0;
            --surface: #ffffff;
            --bg: #f5f5f5;
            --text: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
        }
        header {
            background: var(--green);
            color: white;
            padding: 24px 0 20px;
        }
        header h1 { font-size: 26px; font-weight: 700; }
        header p { opacity: 0.85; margin-top: 4px; font-size: 14px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        section { margin-top: 28px; }
        h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
        h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }

        /* ── Alphabet Overview ── */
        .athlete-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 640px) { .athlete-grid { grid-template-columns: 1fr; } }

        .athlete-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .athlete-name {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .athlete-meta {
            font-size: 13px;
            color: var(--grey);
            margin-bottom: 16px;
        }
        .alpha-rows { display: flex; flex-direction: column; gap: 10px; }
        .alpha-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alpha-label {
            font-size: 13px;
            font-weight: 600;
            width: 72px;
            flex-shrink: 0;
            color: var(--grey);
        }
        .bar-track {
            flex: 1;
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 5px;
            background: var(--blue);
            transition: width 0.3s;
        }
        .bar-fill.complete { background: var(--green); }
        .bar-count {
            font-size: 12px;
            color: var(--grey);
            width: 44px;
            text-align: right;
            flex-shrink: 0;
        }
        .badge-complete {
            font-size: 11px;
            font-weight: 600;
            background: var(--green-light);
            color: var(--green);
            padding: 2px 7px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        /* ── Next Alphabets ── */
        .next-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 640px) { .next-grid { grid-template-columns: 1fr; } }

        .next-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .next-card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 14px;
        }
        .next-card-header h3 { margin: 0; }
        .progress-fraction {
            font-size: 13px;
            color: var(--grey);
        }
        .letters-needed {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .letter-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--orange-light);
            border-radius: 8px;
            padding: 6px 10px;
        }
        .letter-chip .ltr {
            font-size: 17px;
            font-weight: 700;
            color: var(--orange);
            line-height: 1;
        }
        .letter-chip .runs {
            font-size: 11px;
            color: var(--orange);
            white-space: nowrap;
        }
        .alpha6 .letter-chip { background: var(--blue-light); }
        .alpha6 .letter-chip .ltr { color: var(--blue); }
        .alpha6 .letter-chip .runs { color: var(--blue); }

        /* ── Joint targets ── */
        .joint-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .joint-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 640px) { .joint-grid { grid-template-columns: 1fr; } }
        .joint-letter-chip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .joint-letter-chip.both { background: #fce4ec; }
        .joint-letter-chip.lisa-only { background: #e8f5e9; }
        .joint-letter-chip.beth-only { background: #e3f2fd; }
        .joint-letter-chip .jltr { font-weight: 700; font-size: 16px; }
        .who-needs { font-size: 12px; color: var(--grey); }

        /* ── Map ── */
        #map {
            width: 100%;
            height: 420px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            color: var(--grey);
            font-size: 12px;
            padding: 24px 0 32px;
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <h1>🏃 Parkrun Alphabet Challenge</h1>
        <p>Lisa &amp; Beth · Progress through Alphabet 6</p>
    </div>
</header>

<div class="container">

    <!-- 1. Alphabet overview per athlete -->
    <section>
        <h2>Alphabet Progress</h2>
        <div class="athlete-grid" id="athlete-grid"></div>
    </section>

    <!-- 2. Next alphabet details -->
    <section>
        <h2>Letters Needed – Alphabet 5</h2>
        <div class="next-grid" id="alpha5-grid"></div>
    </section>

    <section>
        <h2>Letters Needed – Alphabet 6</h2>
        <div class="next-grid alpha6" id="alpha6-grid"></div>
    </section>

    <!-- 3. Joint planner -->
    <section>
        <div class="joint-section">
            <h2 style="margin-bottom:4px">Joint Planner – Alphabet 5</h2>
            <p style="font-size:13px;color:var(--grey);margin-bottom:16px">Letters where both / one athlete still need to run</p>
            <div class="joint-grid">
                <div>
                    <h3>Both need</h3>
                    <div id="joint-both-5"></div>
                </div>
                <div>
                    <h3>One needs</h3>
                    <div id="joint-one-5"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- 4. Map -->
    <section>
        <h2>Home Locations</h2>
        <div id="map"></div>
    </section>

    <div class="footer" id="footer"></div>

</div>

<script>
const ATHLETE_IDS = {
    '3934942': { name: 'Lisa', location: 'Chepstow', lat: 51.6521, lng: -2.5124 },
    '2475659': { name: 'Beth', location: 'Cheltenham', lat: 51.8958, lng: -2.0833 }
};

let data = {};

async function loadData() {
    try {
        const r = await fetch('parkrun-data.json');
        data = await r.json();
        render();
    } catch (e) {
        document.body.innerHTML += `<p style="padding:20px;color:red">Failed to load parkrun-data.json: ${e}</p>`;
    }
}

function getAthlete(id) {
    return data[id] || null;
}

function render() {
    renderAthleteCards();
    renderNextAlpha('alphabet_5', 'alpha5-grid', false);
    renderNextAlpha('alphabet_6', 'alpha6-grid', true);
    renderJointPlanner();
    initMap();
    renderFooter();
}

function renderAthleteCards() {
    const grid = document.getElementById('athlete-grid');
    grid.innerHTML = '';

    Object.entries(ATHLETE_IDS).forEach(([id, meta]) => {
        const a = getAthlete(id);
        if (!a) return;

        const rowsHtml = Object.entries(a.alphabet_status).map(([key, status]) => {
            const n = key.replace('alphabet_', '');
            const pct = Math.round((status.completed / status.total) * 100);
            const isComplete = status.is_complete;
            return `
                <div class="alpha-row">
                    <span class="alpha-label">Alpha ${n}</span>
                    <div class="bar-track">
                        <div class="bar-fill ${isComplete ? 'complete' : ''}" style="width:${pct}%"></div>
                    </div>
                    <span class="bar-count">${status.completed}/${status.total}</span>
                    ${isComplete ? '<span class="badge-complete">✓ Done</span>' : ''}
                </div>`;
        }).join('');

        grid.innerHTML += `
            <div class="athlete-card">
                <div class="athlete-name">${a.name}</div>
                <div class="athlete-meta">${meta.location} · ${a.total_runs} runs</div>
                <div class="alpha-rows">${rowsHtml}</div>
            </div>`;
    });
}

function renderNextAlpha(alphaKey, containerId, isAlpha6) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    Object.entries(ATHLETE_IDS).forEach(([id, meta]) => {
        const a = getAthlete(id);
        if (!a) return;
        const status = a.alphabet_status[alphaKey];
        if (!status) return;

        const chipsHtml = status.remaining.map(letter => {
            const runs = status.runs_needed[letter] || 1;
            return `<div class="letter-chip">
                <span class="ltr">${letter}</span>
                <span class="runs">×${runs} run${runs > 1 ? 's' : ''}</span>
            </div>`;
        }).join('');

        const n = alphaKey.replace('alphabet_', '');
        container.innerHTML += `
            <div class="next-card">
                <div class="next-card-header">
                    <h3>${a.name}</h3>
                    <span class="progress-fraction">${status.completed}/${status.total} done</span>
                </div>
                ${status.is_complete
                    ? `<p style="color:var(--green);font-weight:600">✓ Alphabet ${n} complete!</p>`
                    : `<div class="letters-needed">${chipsHtml}</div>`}
            </div>`;
    });
}

function renderJointPlanner() {
    const athletes = Object.entries(ATHLETE_IDS).map(([id]) => {
        const a = getAthlete(id);
        return a ? { name: a.name, remaining: new Set(a.alphabet_status['alphabet_5']?.remaining || []) } : null;
    }).filter(Boolean);

    if (athletes.length < 2) return;

    const [lisa, beth] = athletes;
    const allRemaining = new Set([...lisa.remaining, ...beth.remaining]);
    const sorted = [...allRemaining].sort();

    let bothHtml = '', oneHtml = '';

    sorted.forEach(letter => {
        const lisaNeeds = lisa.remaining.has(letter);
        const bethNeeds = beth.remaining.has(letter);

        if (lisaNeeds && bethNeeds) {
            bothHtml += `<div class="joint-letter-chip both"><span class="jltr">${letter}</span><span class="who-needs">Lisa &amp; Beth</span></div>`;
        } else {
            const who = lisaNeeds ? 'Lisa' : 'Beth';
            const cls = lisaNeeds ? 'lisa-only' : 'beth-only';
            oneHtml += `<div class="joint-letter-chip ${cls}"><span class="jltr">${letter}</span><span class="who-needs">${who}</span></div>`;
        }
    });

    document.getElementById('joint-both-5').innerHTML = bothHtml || '<p style="color:var(--grey);font-size:13px">None</p>';
    document.getElementById('joint-one-5').innerHTML = oneHtml || '<p style="color:var(--grey);font-size:13px">None</p>';
}

function initMap() {
    const map = L.map('map').setView([52.0, -2.0], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const colours = { '3934942': '#2e7d32', '2475659': '#1565c0' };

    Object.entries(ATHLETE_IDS).forEach(([id, meta]) => {
        L.circleMarker([meta.lat, meta.lng], {
            radius: 10,
            fillColor: colours[id],
            color: 'white',
            weight: 2,
            fillOpacity: 0.9
        }).bindPopup(`<strong>${meta.name}</strong><br>${meta.location}`).addTo(map);
    });
}

function renderFooter() {
    const timestamps = Object.values(data)
        .map(a => a.last_updated)
        .filter(Boolean)
        .sort()
        .reverse();
    const ts = timestamps[0] ? new Date(timestamps[0]).toLocaleString('en-GB') : 'unknown';
    document.getElementById('footer').textContent = `Data last updated: ${ts} · Updates every Sunday at 08:00 UTC`;
}

window.addEventListener('load', loadData);
</script>

</body>
</html>
