name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          date -u > debug-run.txt
          echo "APIFY_TOKEN length: ${#APIFY_TOKEN}" >> debug-run.txt
          rm -f parkrun-data.json
          echo "--- script output ---" >> debug-run.txt
          python apify-scraper.py >> debug-run.txt 2>&1 || echo "script exited non-zero" >> debug-run.txt
          echo "parkrun-data.json: $(ls parkrun-data.json 2>/dev/null && echo YES || echo NO)" >> debug-run.txt
          echo "done $(date -u)" >> debug-run.txt
          cat debug-run.txt

      - name: Publish debug log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Debug log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat debug-run.txt >> $GITHUB_STEP_SUMMARY || echo "(debug-run.txt missing)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

          if [ ! -f debug-run.txt ]; then
            echo "WARNING: debug-run.txt not found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          CONTENT=$(base64 -w 0 debug-run.txt)
          SHA=$(curl -sf \
               -H "Authorization: token $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/debug-run.txt" \
               | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

          if [ -n "$SHA" ]; then
            PAYLOAD=$(printf '{"message":"debug: run log","content":"%s","sha":"%s"}' "$CONTENT" "$SHA")
          else
            PAYLOAD=$(printf '{"message":"debug: run log","content":"%s"}' "$CONTENT")
          fi

          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PUT \
               -H "Authorization: token $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -H "Content-Type: application/json" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/debug-run.txt" \
               -d "$PAYLOAD")
          echo "Upload HTTP: $HTTP" >> $GITHUB_STEP_SUMMARY
          cat /tmp/resp.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('commit:', d.get('commit',{}).get('sha','?')[:8])" 2>/dev/null || true

      - name: Check for data and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f parkrun-data.json ]; then
            echo "Data generated - uploading"
            python gh-upload.py parkrun-data.json parkrun-data.json "chore: auto-update parkrun data - {ts}"
          else
            echo "No data generated - see debug-run.txt in repo"
            exit 1
          fi
