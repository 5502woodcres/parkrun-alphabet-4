name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          pip install playwright-stealth==0.0.4 || echo "WARNING: playwright-stealth install failed"
          playwright install chromium --with-deps

      - name: Test Apify proxy auth
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "=== Apify proxy auth test ==="
          if [ -z "$APIFY_TOKEN" ]; then
            echo "APIFY_TOKEN secret is empty or not set"
          else
            echo "Token length: ${#APIFY_TOKEN}"
            echo "Token prefix: ${APIFY_TOKEN:0:10}"
            HTTP_CODE=$(curl -s -o /tmp/proxy-test.txt -w "%{http_code}" \
              -x "http://proxy.apify.com:8000" \
              -U "auto:${APIFY_TOKEN}" \
              --max-time 20 \
              "https://api.ipify.org" 2>&1) || HTTP_CODE="CURL_ERROR"
            echo "HTTP status: $HTTP_CODE"
            echo "Response body: $(cat /tmp/proxy-test.txt 2>/dev/null | head -5)"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "PROXY AUTH: SUCCESS - egress IP: $(cat /tmp/proxy-test.txt)"
            else
              echo "PROXY AUTH: FAILED"
            fi
          fi

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          rm -f parkrun-data.json
          python apify-scraper.py || true
          echo "parkrun-data.json exists: $(test -f parkrun-data.json && echo YES || echo NO)"
          echo "debug-scraper.json exists: $(test -f debug-scraper.json && echo YES || echo NO)"
          if [ -f debug-scraper.json ]; then
            echo "=== debug-scraper.json ==="
            cat debug-scraper.json
            echo "=========================="
          fi

      - name: Commit and push debug log
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if [ -f debug-scraper.json ]; then
            git add debug-scraper.json
            git diff --cached --quiet || git commit -m "debug: scraper log [skip ci]"
          fi
          if [ -f parkrun-data.json ]; then
            git add parkrun-data.json
            git diff --cached --quiet || git commit -m "chore: auto-update parkrun data [skip ci]"
          fi
          git push

      - name: Fail if no data
        run: |
          if [ ! -f parkrun-data.json ]; then
            echo "No data generated - check debug-scraper.json in repo"
            exit 1
          fi
          echo "Success - parkrun-data.json generated"
