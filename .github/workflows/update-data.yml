name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "=== Run started: $(date -u) ===" > debug-run.txt
          echo "Python: $(python --version 2>&1)" >> debug-run.txt
          echo "Requests check: $(python -c 'import requests; print(requests.__version__)' 2>&1)" >> debug-run.txt
          echo "APIFY_TOKEN set: $([ -n "$APIFY_TOKEN" ] && echo yes || echo NO)" >> debug-run.txt
          echo "=== Script output ===" >> debug-run.txt
          python apify-scraper.py >> debug-run.txt 2>&1 || echo "Script exited non-zero" >> debug-run.txt
          echo "=== Files after script ===" >> debug-run.txt
          ls -la debug-*.json debug-*.txt parkrun-data.json 2>&1 >> debug-run.txt
          echo "=== Run ended: $(date -u) ===" >> debug-run.txt
          cat debug-run.txt

      - name: Upload debug log via API
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Upload attempt ===" >> debug-run.txt
          python gh-upload.py debug-run.txt debug-run.txt "debug: run log {ts}" 2>&1 | tee -a debug-run.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          # Upload once more so the full output (including above) is captured
          python gh-upload.py debug-run.txt debug-run.txt "debug: run log {ts}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || echo "Second upload also failed - see summary for details"

      - name: Check if data file was generated
        id: changes
        run: |
          if [ -f parkrun-data.json ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload parkrun data via API
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python gh-upload.py parkrun-data.json parkrun-data.json "chore: auto-update parkrun data - {ts}"

      - name: No data
        if: steps.changes.outputs.changed == 'false'
        run: echo "parkrun-data.json not generated - check debug-run.txt in repo"
