name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "=== Run started: $(date -u) ===" | tee debug-run.txt
          echo "APIFY_TOKEN length: ${#APIFY_TOKEN}" | tee -a debug-run.txt
          rm -f parkrun-data.json
          echo "--- apify-scraper.py output ---" | tee -a debug-run.txt
          python apify-scraper.py 2>&1 | tee -a debug-run.txt || true
          echo "--- end script output ---" | tee -a debug-run.txt
          echo "parkrun-data.json exists: $(ls parkrun-data.json 2>/dev/null && echo YES || echo NO)" | tee -a debug-run.txt
          echo "=== Run ended: $(date -u) ===" | tee -a debug-run.txt

      - name: Upload debug log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python gh-upload.py debug-run.txt debug-run.txt "debug: run log {ts}"

      - name: Check for data and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f parkrun-data.json ]; then
            echo "Data generated - uploading"
            python gh-upload.py parkrun-data.json parkrun-data.json "chore: auto-update parkrun data - {ts}"
          else
            echo "No data generated - check debug-run.txt in repo"
            exit 1
          fi
