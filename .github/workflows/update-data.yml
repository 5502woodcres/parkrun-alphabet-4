name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          {
            echo "=== Run started: $(date -u) ==="
            echo "APIFY_TOKEN length: ${#APIFY_TOKEN}"
            echo "--- apify-scraper.py output ---"
            python apify-scraper.py 2>&1 || true
            echo "--- end ---"
            echo "parkrun-data.json: $(ls parkrun-data.json 2>/dev/null && echo YES || echo NO)"
          } | tee debug-run.txt

      - name: Publish debug log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Debug log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat debug-run.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Upload via curl (avoids any Python/requests issues)
          CONTENT=$(base64 -w 0 debug-run.txt)
          SHA=$(curl -sf -H "Authorization: token $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/debug-run.txt" \
               | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || true)

          PAYLOAD="{\"message\":\"debug: run log $(date -u +%Y-%m-%dT%H:%M)\",\"content\":\"$CONTENT\""
          [ -n "$SHA" ] && PAYLOAD="$PAYLOAD,\"sha\":\"$SHA\""
          PAYLOAD="$PAYLOAD}"

          HTTP=$(curl -sf -X PUT \
               -H "Authorization: token $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -H "Content-Type: application/json" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/debug-run.txt" \
               -d "$PAYLOAD" \
               -w "%{http_code}" -o /tmp/upload_resp.txt 2>&1)
          echo "Upload HTTP status: $HTTP"
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] && echo "Upload OK" || { echo "Upload failed:"; cat /tmp/upload_resp.txt; }

      - name: Check for data and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f parkrun-data.json ]; then
            echo "Data generated - uploading"
            python gh-upload.py parkrun-data.json parkrun-data.json "chore: auto-update parkrun data - {ts}"
          else
            echo "No data generated - see debug log above or debug-run.txt in repo"
            exit 1
          fi
