name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "=== Run started: $(date -u) ===" > debug-run.txt
          echo "Python: $(python --version 2>&1)" >> debug-run.txt
          echo "Requests version: $(python -c 'import requests; print(requests.__version__)' 2>&1)" >> debug-run.txt
          echo "APIFY_TOKEN set: $([ -n "$APIFY_TOKEN" ] && echo YES_len=${#APIFY_TOKEN} || echo NO)" >> debug-run.txt
          # Remove stale parkrun-data.json so we only commit a freshly-generated one
          rm -f parkrun-data.json
          echo "=== Script output ===" >> debug-run.txt
          python apify-scraper.py >> debug-run.txt 2>&1 || echo "Script exited non-zero" >> debug-run.txt
          echo "=== Files after script ===" >> debug-run.txt
          ls -la . 2>&1 >> debug-run.txt
          echo "=== Run ended: $(date -u) ===" >> debug-run.txt
          echo ""
          echo "===== DEBUG LOG ====="
          cat debug-run.txt
          echo "===== END DEBUG LOG ====="

      - name: Commit debug log to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add debug-run.txt
          git diff --staged --quiet || git commit -m "debug: run log $(date -u +%Y-%m-%dT%H:%M)"
          git push origin main || echo "Push failed"

      - name: Check if fresh data was generated
        id: changes
        run: |
          if [ -f parkrun-data.json ]; then
            echo "Data file generated successfully"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No data file - scraper likely failed"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload parkrun data via API
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python gh-upload.py parkrun-data.json parkrun-data.json "chore: auto-update parkrun data - {ts}"

      - name: No data generated
        if: steps.changes.outputs.changed == 'false'
        run: echo "parkrun-data.json not generated - check debug-run.txt committed to repo"
