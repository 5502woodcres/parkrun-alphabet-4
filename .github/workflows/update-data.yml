name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test parkrun API connectivity
        run: |
          echo "=== curl test ==="
          curl -s -o /tmp/parkrun-test.json -w "HTTP %{http_code} | Size: %{size_download} bytes\n" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: application/json" \
            -H "X-Requested-With: XMLHttpRequest" \
            "https://www.parkrun.org.uk/results/athleteresultshistory/?athleteNumber=3934942&offset=0&nbRecords=5"
          echo "=== First 2000 chars of response ==="
          head -c 2000 /tmp/parkrun-test.json

      - name: Fetch parkrun data
        run: |
          python apify-scraper.py || true

      - name: Save debug output on failure
        if: always()
        run: |
          python -c "
import requests, json
HEADERS = {
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
    'Accept': 'application/json',
    'X-Requested-With': 'XMLHttpRequest',
}
r = requests.get('https://www.parkrun.org.uk/results/athleteresultshistory/', params={'athleteNumber': '3934942', 'offset': 0, 'nbRecords': 3}, headers=HEADERS)
print('Status:', r.status_code)
print('Content-Type:', r.headers.get('Content-Type'))
data = r.json()
print(json.dumps(data, indent=2))
" 2>&1 | tee /tmp/parkrun-debug.txt || true
          cat /tmp/parkrun-debug.txt || true

      - name: Check if data changed
        id: changes
        run: |
          if git diff --quiet parkrun-data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Parkrun Data Bot"
          git add parkrun-data.json
          git commit -m "chore: auto-update parkrun data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "Data unchanged"
