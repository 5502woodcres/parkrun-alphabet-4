name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "=== Run started: $(date -u) ===" > debug-run.txt
          echo "Python: $(python --version 2>&1)" >> debug-run.txt
          echo "Requests check: $(python -c 'import requests; print(requests.__version__)' 2>&1)" >> debug-run.txt
          echo "APIFY_TOKEN set: $([ -n "$APIFY_TOKEN" ] && echo yes || echo NO)" >> debug-run.txt
          echo "=== Script output ===" >> debug-run.txt
          python apify-scraper.py >> debug-run.txt 2>&1 || echo "Script exited non-zero" >> debug-run.txt
          echo "=== Files after script ===" >> debug-run.txt
          ls -la debug-*.json debug-*.txt parkrun-data.json 2>&1 >> debug-run.txt
          echo "=== Run ended: $(date -u) ===" >> debug-run.txt
          cat debug-run.txt

      - name: Commit debug log (always)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Parkrun Data Bot"
          cp debug-run.txt /tmp/debug-run-new.txt 2>/dev/null || true
          cp debug-scraper.json /tmp/debug-new.json 2>/dev/null || true
          git pull --rebase origin main || true
          cp /tmp/debug-run-new.txt debug-run.txt 2>/dev/null || true
          cp /tmp/debug-new.json debug-scraper.json 2>/dev/null || true
          git add debug-run.txt debug-scraper.json || true
          git diff --staged --quiet || git commit -m "debug: run log $(date -u +'%H:%M UTC')"
          git push origin HEAD:main || true

      - name: Check if data changed
        id: changes
        run: |
          if [ ! -f parkrun-data.json ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          elif git diff --quiet parkrun-data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Parkrun Data Bot"
          git pull --rebase origin main || true
          git add parkrun-data.json
          git commit -m "chore: auto-update parkrun data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push origin HEAD:main

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "Data unchanged or not generated"
