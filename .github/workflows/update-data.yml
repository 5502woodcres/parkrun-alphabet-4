name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python apify-scraper.py || true

      - name: Commit debug log (always)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Parkrun Data Bot"
          cp debug-scraper.json /tmp/debug-new.json 2>/dev/null || true
          git pull --rebase origin main || true
          cp /tmp/debug-new.json debug-scraper.json 2>/dev/null || true
          git add debug-scraper.json || true
          git diff --staged --quiet || git commit -m "debug: scraper log $(date -u +'%H:%M UTC')"
          git push origin HEAD:main || true

      - name: Check if data changed
        id: changes
        run: |
          if [ ! -f parkrun-data.json ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          elif git diff --quiet parkrun-data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Parkrun Data Bot"
          git pull --rebase origin main || true
          git add parkrun-data.json
          git commit -m "chore: auto-update parkrun data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push origin HEAD:main

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "Data unchanged or not generated"
