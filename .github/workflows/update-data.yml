name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "=== Run started: $(date -u) ===" > debug-run.txt
          echo "Python: $(python --version 2>&1)" >> debug-run.txt
          echo "Requests check: $(python -c 'import requests; print(requests.__version__)' 2>&1)" >> debug-run.txt
          echo "APIFY_TOKEN set: $([ -n "$APIFY_TOKEN" ] && echo yes || echo NO)" >> debug-run.txt
          echo "=== Script output ===" >> debug-run.txt
          python apify-scraper.py >> debug-run.txt 2>&1 || echo "Script exited non-zero" >> debug-run.txt
          echo "=== Files after script ===" >> debug-run.txt
          ls -la debug-*.json debug-*.txt parkrun-data.json 2>&1 >> debug-run.txt
          echo "=== Run ended: $(date -u) ===" >> debug-run.txt
          cat debug-run.txt

      - name: Upload debug log via API
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - << 'PYEOF'
          import base64, json, os, sys
          try:
              import requests as req
          except ImportError:
              import urllib.request as req
              req = None

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          path = 'debug-run.txt'

          if not os.path.exists(path):
              print(f"ERROR: {path} not found in {os.getcwd()}")
              print("Files:", os.listdir('.'))
              sys.exit(0)

          with open(path, 'rb') as f:
              content_b64 = base64.b64encode(f.read()).decode()

          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json'
          }
          api_url = f'https://api.github.com/repos/{repo}/contents/{path}'

          # Get existing SHA
          import urllib.request, urllib.error
          try:
              r = urllib.request.urlopen(
                  urllib.request.Request(api_url, headers=headers))
              existing = json.loads(r.read())
              sha = existing.get('sha', '')
          except urllib.error.HTTPError:
              sha = ''

          import datetime
          payload = {
              'message': f'debug: run log {datetime.datetime.utcnow().strftime("%H:%M UTC")}',
              'content': content_b64
          }
          if sha:
              payload['sha'] = sha

          data = json.dumps(payload).encode()
          req2 = urllib.request.Request(api_url, data=data, headers=headers, method='PUT')
          try:
              r = urllib.request.urlopen(req2)
              print(f'Upload status: {r.status} - SUCCESS')
          except urllib.error.HTTPError as e:
              print(f'Upload failed: {e.code} {e.read().decode()}')
              sys.exit(1)
          PYEOF

      - name: Check if data file was generated
        id: changes
        run: |
          if [ -f parkrun-data.json ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload parkrun data via API
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - << 'PYEOF'
          import base64, json, os, sys, datetime, urllib.request, urllib.error

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          path = 'parkrun-data.json'

          with open(path, 'rb') as f:
              content_b64 = base64.b64encode(f.read()).decode()

          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json'
          }
          api_url = f'https://api.github.com/repos/{repo}/contents/{path}'

          try:
              r = urllib.request.urlopen(urllib.request.Request(api_url, headers=headers))
              sha = json.loads(r.read()).get('sha', '')
          except urllib.error.HTTPError:
              sha = ''

          ts = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')
          payload = {'message': f'chore: auto-update parkrun data - {ts}', 'content': content_b64}
          if sha:
              payload['sha'] = sha

          data = json.dumps(payload).encode()
          req2 = urllib.request.Request(api_url, data=data, headers=headers, method='PUT')
          try:
              r = urllib.request.urlopen(req2)
              print(f'Data upload status: {r.status} - SUCCESS')
          except urllib.error.HTTPError as e:
              print(f'Upload failed: {e.code} {e.read().decode()}')
              sys.exit(1)
          PYEOF

      - name: No data
        if: steps.changes.outputs.changed == 'false'
        run: echo "parkrun-data.json not generated - check debug-run.txt in repo"
