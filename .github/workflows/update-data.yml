name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python apify-scraper.py
      
      - id: changes
        run: |
          if git diff --quiet parkrun-data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Parkrun Data Bot"
          git add parkrun-data.json
          git commit -m "chore: auto-update parkrun data"
          git push
