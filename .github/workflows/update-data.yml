name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "=== Run started: $(date -u) ===" | tee debug-run.txt
          echo "Python: $(python --version 2>&1)" | tee -a debug-run.txt
          echo "Requests: $(python -c 'import requests; print(requests.__version__)' 2>&1)" | tee -a debug-run.txt
          echo "APIFY_TOKEN: $([ -n "$APIFY_TOKEN" ] && echo "SET (length=${#APIFY_TOKEN})" || echo "NOT SET")" | tee -a debug-run.txt
          # Remove stale parkrun-data.json so we only commit a freshly-generated one
          rm -f parkrun-data.json
          echo "=== Script output ===" | tee -a debug-run.txt
          python apify-scraper.py 2>&1 | tee -a debug-run.txt
          echo "Exit code: $?" | tee -a debug-run.txt
          echo "=== Files after script ===" | tee -a debug-run.txt
          ls -la . 2>&1 | tee -a debug-run.txt
          echo "=== Run ended: $(date -u) ===" | tee -a debug-run.txt

      - name: Publish debug log to repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- Uploading debug-run.txt via gh api ---"
          CONTENT=$(base64 -w 0 debug-run.txt)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/debug-run.txt" --jq '.sha' 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api "repos/$GITHUB_REPOSITORY/contents/debug-run.txt" \
              -X PUT \
              -f message="debug: run log $(date -u +%Y-%m-%dT%H:%M)" \
              -f "content=$CONTENT" \
              -f "sha=$SHA" \
              && echo "Updated debug-run.txt (sha=$SHA)" \
              || echo "FAILED to update debug-run.txt"
          else
            gh api "repos/$GITHUB_REPOSITORY/contents/debug-run.txt" \
              -X PUT \
              -f message="debug: run log $(date -u +%Y-%m-%dT%H:%M)" \
              -f "content=$CONTENT" \
              && echo "Created debug-run.txt" \
              || echo "FAILED to create debug-run.txt"
          fi

      - name: Check if fresh data was generated
        id: changes
        run: |
          if [ -f parkrun-data.json ]; then
            echo "Data file generated successfully"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No data file - scraper failed, check debug-run.txt in repo"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload parkrun data via API
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python gh-upload.py parkrun-data.json parkrun-data.json "chore: auto-update parkrun data - {ts}"

      - name: No data generated
        if: steps.changes.outputs.changed == 'false'
        run: echo "parkrun-data.json not generated - check debug-run.txt committed to repo"
