name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "=== Run started: $(date -u) ===" > debug-run.txt
          echo "Python: $(python --version 2>&1)" >> debug-run.txt
          echo "Requests check: $(python -c 'import requests; print(requests.__version__)' 2>&1)" >> debug-run.txt
          echo "APIFY_TOKEN set: $([ -n "$APIFY_TOKEN" ] && echo yes || echo NO)" >> debug-run.txt
          echo "=== Script output ===" >> debug-run.txt
          python apify-scraper.py >> debug-run.txt 2>&1 || echo "Script exited non-zero" >> debug-run.txt
          echo "=== Files after script ===" >> debug-run.txt
          ls -la debug-*.json debug-*.txt parkrun-data.json 2>&1 >> debug-run.txt
          echo "=== Run ended: $(date -u) ===" >> debug-run.txt
          cat debug-run.txt

      - name: Upload debug log via API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f debug-run.txt ]; then
            echo "debug-run.txt exists, uploading..."
            CONTENT=$(base64 -w0 debug-run.txt)
            SHA=$(gh api repos/${{ github.repository }}/contents/debug-run.txt --jq '.sha' 2>/dev/null || echo "")
            if [ -n "$SHA" ]; then
              gh api repos/${{ github.repository }}/contents/debug-run.txt -X PUT \
                -f message="debug: run log $(date -u +'%H:%M UTC')" \
                -f content="$CONTENT" \
                -f sha="$SHA" && echo "Updated existing file"
            else
              gh api repos/${{ github.repository }}/contents/debug-run.txt -X PUT \
                -f message="debug: run log $(date -u +'%H:%M UTC')" \
                -f content="$CONTENT" && echo "Created new file"
            fi
          else
            echo "ERROR: debug-run.txt not found in $(pwd)"
            ls -la
          fi

      - name: Check if data changed
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f parkrun-data.json ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            # Compare local file with remote version
            REMOTE_SHA=$(gh api repos/${{ github.repository }}/contents/parkrun-data.json --jq '.sha' 2>/dev/null || echo "")
            if [ -z "$REMOTE_SHA" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              LOCAL_SHA=$(git hash-object parkrun-data.json)
              if [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
                echo "changed=false" >> $GITHUB_OUTPUT
              else
                echo "changed=true" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - name: Commit and push data
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT=$(base64 -w0 parkrun-data.json)
          SHA=$(gh api repos/${{ github.repository }}/contents/parkrun-data.json --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api repos/${{ github.repository }}/contents/parkrun-data.json -X PUT \
              -f message="chore: auto-update parkrun data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
              -f content="$CONTENT" \
              -f sha="$SHA"
          else
            gh api repos/${{ github.repository }}/contents/parkrun-data.json -X PUT \
              -f message="chore: auto-update parkrun data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
              -f content="$CONTENT"
          fi

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "Data unchanged or not generated"
