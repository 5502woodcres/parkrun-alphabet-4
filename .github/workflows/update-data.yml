name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify APIFY_TOKEN is set
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "FATAL: APIFY_TOKEN secret is not set or is empty"
            exit 1
          fi
          echo "APIFY_TOKEN is set (length=${#APIFY_TOKEN})"

      - name: Fetch parkrun data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "=== Run started: $(date -u) ==="
          echo "APIFY_TOKEN length: ${#APIFY_TOKEN}"
          rm -f parkrun-data.json
          python apify-scraper.py
          echo "=== Script finished ==="
          ls -la parkrun-data.json 2>/dev/null || echo "parkrun-data.json NOT generated"

      - name: Upload debug log via Python
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Write a simple status file we can read from the API
          echo "Run: $(date -u)" > debug-run.txt
          echo "APIFY_TOKEN_SET: ${{ secrets.APIFY_TOKEN != '' && 'yes' || 'no' }}" >> debug-run.txt
          ls -la >> debug-run.txt 2>&1
          python gh-upload.py debug-run.txt debug-run.txt "debug: status $(date -u +%Y-%m-%dT%H:%M)"

      - name: Check if fresh data was generated
        id: changes
        run: |
          if [ -f parkrun-data.json ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload parkrun data via API
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python gh-upload.py parkrun-data.json parkrun-data.json "chore: auto-update parkrun data - {ts}"

      - name: No data generated
        if: steps.changes.outputs.changed == 'false'
        run: echo "parkrun-data.json not generated"
