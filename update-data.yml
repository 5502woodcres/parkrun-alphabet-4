name: Update Parkrun Data

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python3 fetch-parkrun-data.py
      - run: |
          git config user.name "Parkrun Bot"
          git config user.email "bot@parkrun.local"
          if git diff --quiet parkrun-data.json; then
            echo "No changes to parkrun data"
          else
            git add parkrun-data.json
            git commit -m "chore: update parkrun data [automated]"
            git push
          fi
